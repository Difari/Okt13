<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Тестовое приложение</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        color: var(--tg-theme-text-color, #000000);
        background: var(--tg-theme-bg-color, #ffffff);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        overflow: hidden;
      }

      .Main {
        width: 100%;
        padding: 25px;
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
      }

      h1 {
        margin-top: 40px;
        margin-bottom: 10px;
        font-size: 24px;
      }

      img {
        width: 70px;
        margin: 30px auto;
      }

      p {
        margin-bottom: 20px;
        font-size: 16px;
      }

      .btn {
        border: 0;
        border-radius: 5px;
        margin-top: 50px;
        height: 60px;
        width: 200px;
        font-size: 20px;
        font-weight: 500;
        cursor: pointer;
        color: var(--tg-theme-button-text-color, #ffffff);
        background: var(--tg-theme-button-color, #007bff);
        transition: opacity 0.2s;
      }

      .btn:hover {
        opacity: 0.9;
      }

      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="Main">
      <h1>Тестовое приложение</h1>
      <img src="{{ url_for('static', filename='bot.png') }}" alt="Бот" />
      <p>Нажмите кнопку ниже, чтобы взаимодействовать.</p>
      <button id="showMainBtn" class="btn">Показать кнопку Telegram</button>
    </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
      const tg = window.Telegram.WebApp;
      tg.ready();
      tg.expand();

      tg.MainButton.text = "Отправить";
      tg.MainButton.color = tg.themeParams.button_color || '#007bff';
      tg.MainButton.textColor = tg.themeParams.button_text_color || '#ffffff';
      tg.MainButton.isVisible = false;
      tg.MainButton.isActive = true;

      tg.MainButton.onClick(function() {
        tg.sendData('Кнопка нажата!');
        tg.MainButton.isVisible = false;
        document.getElementById('showMainBtn').innerText = 'Готово!';
        document.getElementById('showMainBtn').disabled = true;
      });

      document.getElementById('showMainBtn').addEventListener('click', function() {
        tg.MainButton.isVisible = true;
        this.classList.add('hidden');
      });
    </script>
  </body>
</html>
