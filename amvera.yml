meta:
  environment: python
  toolchain:
    name: pip
    run:
      command: |
        pip install --timeout 120 --index-url https://pypi.org/simple/ -r requirements.txt
        gunicorn --bind 0.0.0.0:${PORT:-5000} Okt13:app  # Okt13:app — файл:instance; замените если sho.py
  containerPort: 5000